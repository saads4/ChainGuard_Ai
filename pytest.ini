[tool:pytest]
# Pytest configuration for ChainGuardAI

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output configuration
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10

# Markers
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interactions
    attack_simulation: Attack simulation tests
    performance: Performance and load tests
    slow: Tests that take longer to run

# Minimum version
minversion = 6.0

# Test timeout (if pytest-timeout is installed)
timeout = 300
timeout_method = thread

# Async test configuration (if pytest-asyncio is installed)
asyncio_mode = auto

# Coverage configuration (if pytest-cov is installed)
# addopts = --cov=core --cov=agents --cov=api --cov-report=html --cov-report=term-missing
